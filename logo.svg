<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 114">
  <defs>
    <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap');]]></style>
    <linearGradient id="mgBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1e2a5e"/>
      <stop offset="100%" stop-color="#083d44"/>
    </linearGradient>
  </defs>

  <!-- Outer shape -->
  <rect x="0.9" y="0.9" width="56.2" height="112.2" rx="9" ry="9"
        fill="url(#mgBg)" stroke="#065b61" stroke-width="2.8"/>

  <!-- Inner border -->
  <rect x="5" y="5" width="48" height="104" rx="5.5" ry="5.5"
        fill="none" stroke="#3a8a92" stroke-width="0.65"/>

  <!-- Golden square ornaments at cardinal points of inner border -->
  <rect x="27" y="3"   width="4" height="4" fill="#d4af37"/>
  <rect x="27" y="107" width="4" height="4" fill="#d4af37"/>
  <rect x="3"  y="55"  width="4" height="4" fill="#d4af37"/>
  <rect x="51" y="55"  width="4" height="4" fill="#d4af37"/>

  <!-- J -->
  <text x="29" y="33"
        text-anchor="middle"
        font-family="Roboto, sans-serif"
        font-size="26" font-weight="300"
        fill="#f0f4ff">J</text>
  <line x1="14" y1="42" x2="44" y2="42" stroke="#065b61" stroke-width="0.9"/>

  <!-- G -->
  <text x="29" y="66"
        text-anchor="middle"
        font-family="Roboto, sans-serif"
        font-size="26" font-weight="300"
        fill="#f0f4ff">G</text>
  <line x1="14" y1="75" x2="44" y2="75" stroke="#065b61" stroke-width="0.9"/>

  <!-- M -->
  <text x="29" y="99"
        text-anchor="middle"
        font-family="Roboto, sans-serif"
        font-size="26" font-weight="300"
        fill="#f0f4ff">M</text>
</svg>
